version: 2

sources:
  - name: greenweez
    schema: gz_raw_data
    description: data for greenweez
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales data for greenweez
        config:
          loaded_at_field: "CAST(date_date AS TIMESTAMP)"
          freshness:
            warn_after:
              count: 90
              period: day
        columns:
          - name: orders_id
            description: unique id of the order
            tests:
              - not_null
          - name: pdt_id
            description: product id in the order
            tests:
              - not_null
        tests:
          - unique:
              arguments:
                column_name: "(orders_id || '-' || pdt_id)"
      - name: product
        identifier: raw_gz_product
        description: Raw product table from greenweez
        columns:
          - name: products_id
            description: Unique identifier for each product
            tests:
              - unique
              - not_null
      - name: ship
        identifier: raw_gz_ship
        description: Raw shipping table from Greenweez
        columns:
          - name: orders_id
            description: Unique order identifier for shipping
            tests:
              - unique
              - not_null
      - name: adwords
        identifier: raw_gz_adwords
      - name: bing
        identifier: raw_gz_bing
      - name: criteo
        identifier: raw_gz_criteo
      - name: facebook
        identifier: raw_gz_facebook

models:
  - name: int_campaigns
    description: Combined campaign metrics across AdWords, Bing, Criteo, and Facebook.
    columns:
      - name: date_date
        description: Campaign date.
        tests:
          - not_null
      - name: paid_source
        description: Advertising platform name.
        tests:
          - not_null
      - name: campaign_key
        description: Campaign identifier key.
      - name: campaign_name
        description: Standardized campaign name across ad platforms.